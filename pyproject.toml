[project]
name = "rag4you-cli"
version = "0.1.0"
description = "Benchmark harness and CLI tools for fully-local RAG evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
ollama = ["httpx>=0.27"]
all-judges = ["anthropic>=0.40", "openai>=1.0", "httpx>=0.27"]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["bench/tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
